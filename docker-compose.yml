services:
  ajk:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD dalam fail .env}
      # Tukar kepada "true" HANYA jika diakses melalui HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ajk-data:/data
volumes:
  ajk-data:
